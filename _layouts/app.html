<!doctype html>
<html class="no-js" lang="en" dir="ltr">
<head>
{% include head.html %}
<script>document.documentElement.classList.remove('lang-pending');</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@600&display=swap&text=%D8%B1%D8%B2%D9%82%20%D8%B1%D8%B3%D8%A7%D9%86">
<link rel="stylesheet" href="{{ '/assets/css/app.css' | relative_url }}">
</head>
<body class="app-body">
<script>
  // Start in the sign-in layout when that's where this visit lands, so the app header doesn't flash first.
  (function () {
    var hash = location.hash, guest = true;
    try { guest = !Object.keys(localStorage).some(function (k) { return /^sb-.+-auth-token$/.test(k); }); } catch (e) {}
    if (/^#\/(login|signup|check-email|forgot-password|reset-password|logout)(\/|$|\?)/.test(hash) || (guest && /^(#\/?)?$/.test(hash))) document.body.dataset.layout = 'auth';
  })();
</script>
<a class="skip-link" href="#app-view">Skip to content</a>
<header class="app-header">
  <div class="app-header__bar">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} website">
      {% include logo.html size=30 %}
      <span class="brand__name notranslate" translate="no">{{ site.title }}</span>
    </a>
    <nav class="app-nav" id="app-nav" aria-label="App"></nav>
  </div>
</header>
<main class="app-main" id="app-view" tabindex="-1"></main>
<footer class="app-footer">
  <a href="{{ '/' | relative_url }}">Website</a>
  <a href="{{ '/faq/' | relative_url }}">Help</a>
  <a href="{{ '/contact/' | relative_url }}">Contact</a>
  <a href="{{ '/legal/' | relative_url }}">Policies</a>
</footer>
<script type="application/json" id="app-config">{"supabaseUrl": {{ site.platform.supabase_url | jsonify }}, "supabaseAnonKey": {{ site.platform.supabase_anon_key | jsonify }}, "siteUrl": {{ '/' | relative_url | jsonify }}}</script>
<script src="{{ '/assets/vendor/supabase-js-2.45.4/supabase.js' | relative_url }}"></script>
<script type="module" src="{{ '/assets/app/main.js' | relative_url }}"></script>
<script>document.documentElement.classList.replace('no-js', 'js');</script>
</body>
</html>
