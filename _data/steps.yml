# Short step lists used on Home and How it works.
vendor:
  - title: List your surplus
    text: Add a photo, the quantity, a price or Rs 0, and a pickup window.
  - title: Someone claims it
    text: A verified collector claims it and pays. You get a notification.
  - title: Hand it over
    text: Check their 4-digit pickup code at the counter. You keep 80% of the price.
collector:
  - title: Find supplies
    text: See listings near you, soonest pickup first.
  - title: Claim and pay
    text: Pay within 30 minutes, or nothing at all for Rs 0 listings.
  - title: Collect
    text: Show your 4-digit pickup code at the counter.
