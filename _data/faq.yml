# Frequently asked questions. Keep it to six, each answered in one or two sentences.
- group: Questions
  id: general
  items:
    - q: Who can share surplus?
      home: true
      a: Stores, bakeries, restaurants, cafes and grocers in Islamabad. We check every vendor before they can list.
    - q: Who can collect?
      home: true
      a: Organizations such as university cafeterias, school canteens, offices and bulk buyers. Individuals can sign up now, and listings open to the public after launch.
    - q: What does it cost?
      home: true
      a: Joining is free. Vendors keep 80% of each sale and Rizq Rasan keeps 20%. Rs 0 listings cost nothing.
    - q: What is a Rs 0 listing?
      home: true
      a: A vendor can give surplus away for free, for example as part of a CSR programme. Collectors claim it without paying.
    - q: How do pickups work?
      home: true
      a: Every claim gets a 4-digit code. The vendor checks it at the counter before handing anything over.
    - q: When does it start?
      home: true
      a: Accounts are open now. Listing and collecting start in Islamabad on 22 March 2027.
