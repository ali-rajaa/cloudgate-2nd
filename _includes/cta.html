{%- comment -%}
  Closing call to action. Params: title, text (optional)
{%- endcomment -%}
<section class="section cta-band">
  <div class="container container--narrow cta-band__inner">
    <h2 class="display display--section">{{ include.title | default: "Ready when you are." }}</h2>
    <p class="lead">{{ include.text | default: "Accounts are open now. Listing and collecting start on 22 March 2027." }}</p>
    <div class="button-row button-row--center">
      <a class="btn btn--primary" href="{{ site.app_url }}#/signup/vendor">Share your surplus</a>
      <a class="btn btn--secondary" href="{{ '/for-collectors/' | relative_url }}">Find supplies</a>
    </div>
  </div>
</section>
